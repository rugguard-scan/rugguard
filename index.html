<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RugGuard — Solana token safety check</title>
<style>
  :root {
    --ink:        #14203a;
    --ink-soft:   #2c3a5a;
    --paper:      #f5f3ee;
    --card:       #ffffff;
    --line:       #dcd7cc;
    --muted:      #6a6f7b;
    --gold:       #b0842f;
    --green:      #2f7d4f;
    --amber:      #c08a1e;
    --red:        #b23636;
    --red-bg:     #fbeceb;
    --shadow:     0 1px 3px rgba(20,32,58,.06), 0 8px 30px rgba(20,32,58,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    padding: 0 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .langbar { display: flex; justify-content: flex-end; padding-top: 18px; }
  .langswitch {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
    overflow: hidden; background: var(--card); box-shadow: var(--shadow);
  }
  .langswitch button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 16px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .langswitch button.active { background: var(--ink); color: #fff; }

  header { padding: 22px 0 28px; text-align: center; }
  .logo {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 40px; font-weight: bold; letter-spacing: -0.5px; color: var(--ink);
  }
  .logo-mark { width: 52px; height: 52px; flex-shrink: 0; }
  .logo-word { line-height: 1; }
  .tag {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; color: var(--muted); margin-top: 8px;
  }

  .intro {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow);
    margin-bottom: 22px; font-size: 15.5px; color: var(--ink-soft);
  }
  .intro strong { color: var(--ink); }

  .scan { background: var(--ink); border-radius: 12px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .scan label { display: block; font-family: -apple-system, sans-serif; color: #c8cfdd; font-size: 14px; margin-bottom: 10px; }
  .scan-row { display: flex; gap: 10px; }
  #mint {
    flex: 1; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px;
    padding: 14px 15px; border: 1px solid #35446a; border-radius: 8px;
    background: #0f1830; color: #f5f3ee; min-width: 0;
  }
  #mint::placeholder { color: #6b7793; }
  #mint:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button.go {
    font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 600;
    padding: 14px 22px; border: none; border-radius: 8px; background: var(--gold);
    color: #fff; cursor: pointer; white-space: nowrap; transition: background .15s ease;
  }
  button.go:hover { background: #9a7127; }
  button.go:disabled { background: #5c5340; cursor: default; }

  .disclaimer {
    font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted);
    text-align: center; padding: 4px 6px 26px;
  }

  #result { display: none; margin-bottom: 40px; }
  #result.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }

  .verdict { border-radius: 12px; padding: 24px; color: #fff; margin-bottom: 18px; box-shadow: var(--shadow); }
  .verdict.low  { background: var(--green); }
  .verdict.mid  { background: var(--amber); }
  .verdict.high { background: var(--red); }
  .verdict .score-line { font-family: -apple-system, sans-serif; font-size: 14px; opacity: .9; display: flex; justify-content: space-between; align-items: baseline; }
  .verdict .score { font-size: 52px; font-weight: bold; line-height: 1.1; margin: 4px 0 10px; }
  .verdict .token-name { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
  .verdict .headline { font-family: -apple-system, sans-serif; font-size: 15px; }

  .checks { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .check { display: flex; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); font-family: -apple-system, sans-serif; }
  .check:last-child { border-bottom: none; }
  .dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; }
  .dot.OK { background: var(--green); }
  .dot.WARN { background: var(--amber); }
  .dot.DANGER { background: var(--red); }
  .dot.UNKNOWN { background: #b9bcc4; }
  .check .body h4 { font-size: 15px; margin-bottom: 2px; color: var(--ink); }
  .check .body p { font-size: 14px; color: var(--muted); }

  .full-disclaimer {
    font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted);
    background: var(--red-bg); border: 1px solid #e9d3d1; border-radius: 10px;
    padding: 18px 20px; margin: 18px 0 44px; line-height: 1.55;
  }
  .full-disclaimer b { color: var(--red); }

  .score-explain {
    font-family: -apple-system, sans-serif; font-size: 14px; color: var(--ink-soft);
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; line-height: 1.5;
  }
  .score-explain b { color: var(--ink); }

  /* Info-knop naast de check-titel */
  .check-head { display: flex; align-items: center; gap: 8px; }
  .info-btn {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--gold); background: transparent; color: var(--gold);
    font-family: Georgia, serif; font-style: italic; font-weight: bold; font-size: 13px;
    line-height: 1; cursor: pointer; padding: 0; display: inline-flex;
    align-items: center; justify-content: center; transition: background .15s ease, color .15s ease;
  }
  .info-btn:hover { background: var(--gold); color: #fff; }
  /* Puls: trekt éénmalig kort de aandacht bij verschijnen, daarna rustig */
  .info-btn.pulse { animation: infopulse 1.1s ease-out 3; }
  @keyframes infopulse {
    0%   { box-shadow: 0 0 0 0 rgba(176,132,47,.55); }
    70%  { box-shadow: 0 0 0 7px rgba(176,132,47,0); }
    100% { box-shadow: 0 0 0 0 rgba(176,132,47,0); }
  }
  @media (prefers-reduced-motion: reduce) { .info-btn.pulse { animation: none; } }

  /* Uitklap-paneel met de driedelige uitleg */
  .info-panel {
    display: none; margin-top: 10px; padding: 12px 14px;
    background: #faf8f3; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13.5px; line-height: 1.5;
  }
  .info-panel.open { display: block; animation: slidein .2s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px);} to {opacity:1; transform:none;} }
  .info-panel p { margin-bottom: 7px; color: var(--ink-soft); }
  .info-panel p:last-child { margin-bottom: 0; }
  .info-panel .tag-see   { font-weight: 700; color: var(--green); }
  .info-panel .tag-blind { font-weight: 700; color: var(--red); }
  .info-panel .tag-diy   { font-weight: 700; color: var(--ink); }

  details.why {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 18px; margin-bottom: 16px; font-family: -apple-system, sans-serif;
  }
  details.why summary {
    cursor: pointer; padding: 12px 0; font-size: 15px; font-weight: 600; color: var(--ink);
    list-style: none;
  }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: "▸ "; color: var(--gold); font-weight: bold; }
  details.why[open] summary::before { content: "▾ "; }
  details.why .why-body { padding: 2px 0 14px; }
  details.why .why-body p { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; }

  .loading { font-family: -apple-system, sans-serif; text-align: center; color: var(--muted); padding: 30px; font-size: 15px; }
  .err { font-family: -apple-system, sans-serif; background: var(--red-bg); border: 1px solid #e9d3d1; color: var(--red); border-radius: 10px; padding: 16px 18px; font-size: 14px; margin-bottom: 20px; }

  footer { font-family: -apple-system, sans-serif; text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0 50px; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .scan-row { flex-direction: column; } .logo { font-size: 32px; } .logo-mark { width: 42px; height: 42px; } }
</style>
</head>

      mintOk:      ["Bijdrukken (mint authority)", "Uitgeschakeld — de voorraad kan niet worden bijgedrukt."],
      mintUnknown: ["Bijdrukken (mint authority)", "Kon niet worden opgehaald."],
      freezeDanger:  ["Wallet bevriezen (freeze authority)", "Actief — de makers kunnen tokens bevriezen, waardoor je niet kunt verkopen (honeypot-risico)."],
      freezeOk:      ["Wallet bevriezen (freeze authority)", "Uitgeschakeld — je tokens kunnen niet worden bevroren."],
      freezeUnknown: ["Wallet bevriezen (freeze authority)", "Kon niet worden opgehaald."],
      liqDanger:  function(v){ return ["Liquiditeit", "Zeer laag ($" + v + "). Makkelijk te manipuleren en verkopen kan vastlopen."]; },
      liqWarn:    function(v){ return ["Liquiditeit", "Laag ($" + v + "). Wees voorzichtig met grotere bedragen."]; },
      liqOk:      function(v){ return ["Liquiditeit", "Redelijk ($" + v + ")."]; },
      liqUnknown: ["Liquiditeit", "Geen handelspaar gevonden."],
      volWarn:    function(v){ return ["Handelsvolume (24u)", "Erg laag ($" + v + "). Weinig kopers en verkopers actief."]; },
      volOk:      function(v){ return ["Handelsvolume (24u)", "$" + v + " verhandeld in 24 uur."]; },
      volUnknown: ["Handelsvolume (24u)", "Onbekend."],
      ageDanger:  function(h){ return ["Leeftijd", "Extreem nieuw (" + h + " uur). Hoogste risico; insiders zitten er nog vroeg in."]; },
      ageWarn:    function(h){ return ["Leeftijd", "Zeer nieuw (" + h + " uur). Nog onbewezen."]; },
      ageOk:      function(d){ return ["Leeftijd", d + " dagen oud."]; },
      ageUnknown: ["Leeftijd", "Aanmaakdatum onbekend."],
      holdDanger:  function(p){ return ["Spreiding van de voorraad", "De 10 grootste wallets bezitten " + p + "%. Zij kunnen de prijs laten instorten."]; },
      holdWarn:    function(p){ return ["Spreiding van de voorraad", "De 10 grootste wallets bezitten " + p + "%. Verhoogd risico."]; },
      holdOk:      function(p){ return ["Spreiding van de voorraad", "De 10 grootste wallets bezitten " + p + "%. Redelijk verspreid."]; },
      holdUnknown: ["Spreiding van de voorraad", "Kon houders niet ophalen."]
    }
  }
};

let lang = "en";
let lastResult = null;

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("lang-en").classList.toggle("active", l === "en");
  document.getElementById("lang-nl").classList.toggle("active", l === "nl");
  applyStaticText();
  if (lastResult) render(lastResult);
}

function applyStaticText() {
  const t = T[lang];
  document.getElementById("t-tag").textContent = t.tag;
  document.getElementById("t-intro").innerHTML = t.intro;
  document.getElementById("t-label").textContent = t.label;
  document.getElementById("go").textContent = t.button;
  document.getElementById("t-strip").textContent = t.strip;
  document.getElementById("t-footer").textContent = t.footer;
}

async function rpc(method, params) {
  const res = await fetch(RPC, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: method, params: params }),
  });
  if (!res.ok) throw new Error(T[lang].rpcErr);
  return (await res.json()).result;
}
async function getDex(mint) {
  try {
    const res = await fetch(DEX + mint);
    if (!res.ok) return null;
    const json = await res.json();
    if (!json.pairs || !json.pairs.length) return null;
    const sol = json.pairs.filter(function(p){ return p.chainId === "solana"; });
    const list = sol.length ? sol : json.pairs;
    return list.reduce(function(a, b){ return ((a.liquidity && a.liquidity.usd || 0) >= (b.liquidity && b.liquidity.usd || 0) ? a : b); });
  } catch (e) { return null; }
}
function fmt(n) { return Math.round(n).toLocaleString(lang === "nl" ? "nl-NL" : "en-US"); }

function buildChecks(info, pair, holders, supply) {
  const checks = [];

  if (!info) checks.push({ key: "freezeUnknown", level: "UNKNOWN", weight: 0 });
  else if (info.freezeAuthority) checks.push({ key: "freezeDanger", level: "DANGER", weight: 25 });
  else checks.push({ key: "freezeOk", level: "OK", weight: 0 });

  if (!info) checks.push({ key: "mintUnknown", level: "UNKNOWN", weight: 0 });
  else if (info.mintAuthority) checks.push({ key: "mintDanger", level: "DANGER", weight: 30 });
  else checks.push({ key: "mintOk", level: "OK", weight: 0 });

  const liq = pair && pair.liquidity ? pair.liquidity.usd : null;
  if (liq == null) checks.push({ key: "liqUnknown", level: "UNKNOWN", weight: 0 });
  else if (liq < 10000) checks.push({ key: "liqDanger", level: "DANGER", weight: 20, arg: liq });
  else if (liq < 50000) checks.push({ key: "liqWarn", level: "WARN", weight: 10, arg: liq });
  else checks.push({ key: "liqOk", level: "OK", weight: 0, arg: liq });

  if (!holders || !supply) checks.push({ key: "holdUnknown", level: "UNKNOWN", weight: 0 });
  else {
    const top = holders.slice(0, 10).reduce(function(s, h){ return s + (h.uiAmount || 0); }, 0);
    const pct = supply ? (top / supply * 100) : 0;
    if (pct > 70) checks.push({ key: "holdDanger", level: "DANGER", weight: 25, arg: pct });
    else if (pct > 40) checks.push({ key: "holdWarn", level: "WARN", weight: 12, arg: pct });
    else checks.push({ key: "holdOk", level: "OK", weight: 0, arg: pct });
  }

  const t = pair ? pair.pairCreatedAt : null;
  if (!t) checks.push({ key: "ageUnknown", level: "UNKNOWN", weight: 0 });
  else {
    const h = (Date.now() - t) / 3.6e6;
    if (h < 1) checks.push({ key: "ageDanger", level: "DANGER", weight: 15, arg: h });
    else if (h < 24) checks.push({ key: "ageWarn", level: "WARN", weight: 8, arg: h });
    else checks.push({ key: "ageOk", level: "OK", weight: 0, arg: h / 24 });
  }

  const v = pair && pair.volume ? pair.volume.h24 : null;
  if (v == null) checks.push({ key: "volUnknown", level: "UNKNOWN", weight: 0 });
  else if (v < 5000) checks.push({ key: "volWarn", level: "WARN", weight: 5, arg: v });
  else checks.push({ key: "volOk", level: "OK", weight: 0, arg: v });

  return checks;
}

function localizeCheck(c) {
  const entry = T[lang].checks[c.key];
  if (typeof entry === "function") {
    let a = c.arg;
    if (c.key.indexOf("liq") === 0 || c.key.indexOf("vol") === 0) a = fmt(a);
    else if (c.key.indexOf("age") === 0) a = a.toFixed(1);
    else if (c.key.indexOf("hold") === 0) a = a.toFixed(0);
    return entry(a);
  }
  return entry;
}

async function analyze(mint) {
  const pair = await getDex(mint);
  let info = null, supply = null, holders = null;
  try { const acc = await rpc("getAccountInfo", [mint, { encoding: "jsonParsed" }]); info = acc && acc.value && acc.value.data && acc.value.data.parsed ? acc.value.data.parsed.info : null; } catch (e) {}
  try { const s = await rpc("getTokenSupply", [mint]); supply = s && s.value ? s.value.uiAmount : null; } catch (e) {}
  try { const h = await rpc("getTokenLargestAccounts", [mint]); holders = h ? h.value : null; } catch (e) {}

  const checks = buildChecks(info, pair, holders, supply);
  let score = Math.min(100, checks.filter(function(c){ return c.level === "DANGER" || c.level === "WARN"; }).reduce(function(s, c){ return s + c.weight; }, 0));
  const dangers = checks.filter(function(c){ return c.level === "DANGER"; }).length;

  let band;
  if (score >= 60 || dangers >= 2) band = "high";
  else if (score >= 30 || dangers >= 1) band = "mid";
  else band = "low";

  return {
    checks: checks, score: score, band: band, dangers: dangers,
    name: pair && pair.baseToken ? pair.baseToken.name : null,
    symbol: pair && pair.baseToken ? pair.baseToken.symbol : "?",
  };
}

function render(r) {
  const t = T[lang];
  const out = document.getElementById("result");
  const name = r.name || t.unknownToken;

  // categorie uit de check-key halen (mint/freeze/liq/hold/age/vol) voor de uitleg
  function plainFor(key) {
    var cat = key.replace(/Danger|Warn|Ok|Unknown$/,"");
    return t.plain[cat] || null;
  }

  const rows = r.checks.map(function(c, i){
    const loc = localizeCheck(c);
    const info = plainFor(c.key);
    var infoBtn = "", infoPanel = "";
    if (info) {
      const lb = t.plainLabels;
      infoBtn = '<button class="info-btn pulse" aria-label="info" onclick="toggleInfo(' + i + ')">i</button>';
      infoPanel =
        '<div class="info-panel" id="info-' + i + '">' +
          '<p><span class="tag-see">' + escapeHtml(lb.see) + ':</span> ' + escapeHtml(info.see) + '</p>' +
          '<p><span class="tag-blind">' + escapeHtml(lb.blind) + ':</span> ' + escapeHtml(info.blind) + '</p>' +
          '<p><span class="tag-diy">' + escapeHtml(lb.diy) + ':</span> ' + escapeHtml(info.diy) + '</p>' +
        '</div>';
    }
    return '<div class="check">' +
        '<div class="dot ' + c.level + '"></div>' +
        '<div class="body">' +
          '<div class="check-head"><h4>' + escapeHtml(loc[0]) + '</h4>' + infoBtn + '</div>' +
          '<p>' + escapeHtml(loc[1]) + '</p>' +
          infoPanel +
        '</div>' +
      '</div>';
  }).join("");

  out.className = "show";
  out.innerHTML =
    '<div class="verdict ' + r.band + '">' +
      '<div class="token-name">' + escapeHtml(name) + ' (' + escapeHtml(r.symbol) + ')</div>' +
      '<div class="score-line"><span>' + t.scoreLabel + '</span><span>' + t.scoreHint + '</span></div>' +
      '<div class="score">' + r.score + '<span style="font-size:22px;opacity:.7">/100</span></div>' +
      '<div class="headline">' + t.verdict[r.band] + '</div>' +
    '</div>' +
    '<div class="score-explain">' + t.scoreExplain + '</div>' +
    '<div class="checks">' + rows + '</div>' +
    '<details class="why"><summary>' + escapeHtml(t.whyTitle) + '</summary>' +
      '<div class="why-body">' + t.whyBody.split("\n\n").map(function(par){ return '<p>' + escapeHtml(par) + '</p>'; }).join("") + '</div>' +
    '</details>' +
    '<div class="full-disclaimer">' + t.disclaimer + '</div>';

  // stop de puls zodra de gebruiker gescrold/geklikt heeft, zodat het niet blijft trekken
  // (de puls-animatie speelt sowieso maar kort; dit is een extra rust-maatregel)
}

// info-uitleg openen/sluiten per check
function toggleInfo(i) {
  var panel = document.getElementById("info-" + i);
  if (!panel) return;
  panel.classList.toggle("open");
  // knop is aangeklikt -> puls van alle knoppen weghalen (aandacht is niet meer nodig)
  var btns = document.querySelectorAll(".info-btn.pulse");
  btns.forEach(function(b){ b.classList.remove("pulse"); });
}

function run() {
  const mint = document.getElementById("mint").value.trim();
  const out = document.getElementById("result");
  const btn = document.getElementById("go");
  const t = T[lang];

  if (mint.length < 32 || mint.length > 46) {
    lastResult = null;
    out.className = "show";
    out.innerHTML = '<div class="err">' + t.badAddr + '</div>';
    return;
  }

  btn.disabled = true; btn.textContent = t.scanning;
  out.className = "show";
  out.innerHTML = '<div class="loading">' + t.loading + '</div>';

  analyze(mint).then(function(r){
    lastResult = r;
    render(r);
    btn.disabled = false; btn.textContent = t.button;
  }).catch(function(err){
    lastResult = null;
    out.innerHTML = '<div class="err">' + t.somethingWrong + escapeHtml(err.message) + '<br>' + t.rpcErr + '</div>';
    btn.disabled = false; btn.textContent = t.button;
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(m){ return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[m]; });
}

document.getElementById("mint").addEventListener("keydown", function(e){ if (e.key === "Enter") run(); });

applyStaticText();
</script>
