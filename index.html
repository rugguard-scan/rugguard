<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RugGuard — Solana token safety check</title>
<style>
  :root {
    /* Donkere, iets warme indigo-nacht i.p.v. pikzwart cliché */
    --bg:        #12101f;
    --bg-2:      #1a1730;
    --surface:   #201c38;
    --surface-2: #282247;
    --line:      #362f57;
    --text:      #f3f1fb;
    --text-soft: #c7c2e0;
    --muted:     #8b86a8;
    /* Accenten */
    --mint:      #34e2b0;   /* veilig / laag risico */
    --mint-dim:  #1f8f6f;
    --violet:    #8b6bff;   /* merk-energie */
    --amber2:    #ffb638;   /* midden */
    --coral:     #ff5d6c;   /* gevaar / hoog risico */
    --coral-dim: #b23545;
    --glow-mint: 0 0 0 1px rgba(52,226,176,.35), 0 8px 30px rgba(52,226,176,.18);
    --glow-violet: 0 10px 40px rgba(139,107,255,.28);
    --shadow: 0 2px 8px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.35);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Space Grotesk', ui-rounded, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(139,107,255,.20), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(52,226,176,.10), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.55;
    padding: 0 18px;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* Bovenbalk */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; }
  .langswitch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
    overflow: hidden; background: var(--surface);
  }
  .langswitch button {
    border: none; background: transparent; cursor: pointer;
    padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted);
    font-family: inherit; transition: color .15s ease;
  }
  .langswitch button.active { background: var(--violet); color: #fff; }
  .helpbtn {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 15px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--text-soft); cursor: pointer; margin-right: 10px;
    transition: border-color .15s ease, color .15s ease;
  }
  .helpbtn:hover { border-color: var(--mint); color: var(--mint); }

  /* Header */
  header { padding: 26px 0 22px; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 13px; font-size: 34px; font-weight: 700; letter-spacing: -1px; color: var(--text); }
  .logo-mark { width: 48px; height: 48px; flex-shrink: 0; filter: drop-shadow(0 4px 14px rgba(139,107,255,.4)); }
  .logo-word { line-height: 1; }
  .tag { font-size: 15px; color: var(--text-soft); margin-top: 10px; font-weight: 500; }

  /* Intro */
  .intro {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px;
    margin-bottom: 20px; font-size: 15px; color: var(--text-soft);
  }
  .intro strong { color: var(--text); font-weight: 600; }

  /* Scan-box: de held-input */
  .scan {
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line); border-radius: 22px; padding: 22px;
    margin-bottom: 12px; box-shadow: var(--glow-violet);
  }
  .scan label { display: block; font-size: 13px; margin-bottom: 10px; color: var(--text-soft); font-weight: 600; }
  .scan-row { display: flex; gap: 10px; }
  #mint {
    flex: 1; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px;
    padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--bg-2); color: var(--text); min-width: 0;
  }
  #mint::placeholder { color: var(--muted); }
  #mint:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,107,255,.25); }
  button.go {
    font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 15px 24px; border: none; border-radius: 14px; white-space: nowrap; cursor: pointer;
    background: linear-gradient(135deg, var(--mint), #2ad0e0); color: #0b1220;
    transition: transform .1s ease, box-shadow .2s ease;
    box-shadow: 0 6px 20px rgba(52,226,176,.35);
  }
  button.go:hover { transform: translateY(-1px); box-shadow: 0 9px 26px rgba(52,226,176,.45); }
  button.go:active { transform: translateY(0); }
  button.go:disabled { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: default; }

  .disclaimer { font-size: 12.5px; color: var(--muted); text-align: center; padding: 4px 6px 24px; }

  #result { display: none; margin-bottom: 40px; }
  #result.show { display: block; }

  /* Verdict / score-hero */
  .verdict {
    border-radius: 22px; padding: 26px 24px; margin-bottom: 16px; position: relative; overflow: hidden;
    border: 1px solid var(--line);
  }
  .verdict.low  { background: radial-gradient(120% 140% at 50% -20%, rgba(52,226,176,.28), transparent 60%), var(--surface); }
  .verdict.mid  { background: radial-gradient(120% 140% at 50% -20%, rgba(255,182,56,.26), transparent 60%), var(--surface); }
  .verdict.high { background: radial-gradient(120% 140% at 50% -20%, rgba(255,93,108,.28), transparent 60%), var(--surface); }
  .verdict .token-name { font-size: 17px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .verdict .score-line { font-size: 13px; color: var(--text-soft); display: flex; justify-content: space-between; align-items: baseline; }
  .verdict .score { font-size: 66px; font-weight: 700; line-height: 1; margin: 6px 0 12px; letter-spacing: -2px; }
  .verdict.low  .score { color: var(--mint); }
  .verdict.mid  .score { color: var(--amber2); }
  .verdict.high .score { color: var(--coral); }
  .verdict .score.count { animation: countpop .5s ease-out; }
  @keyframes countpop { from { opacity:0; transform: scale(.7); } to { opacity:1; transform: scale(1);} }
  .verdict .headline { font-size: 15px; font-weight: 500; color: var(--text); }

  /* Score-meterbalk */
  .meter { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; margin: 2px 0 14px; }
  .meter > span { display: block; height: 100%; border-radius: 99px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .verdict.low  .meter > span { background: linear-gradient(90deg, var(--mint), #2ad0e0); }
  .verdict.mid  .meter > span { background: linear-gradient(90deg, var(--amber2), #ff9f45); }
  .verdict.high .meter > span { background: linear-gradient(90deg, var(--coral), #ff7a52); }

  /* Score-uitleg blokje */
  .score-explain {
    font-size: 13.5px; color: var(--text-soft); background: var(--surface);
    border: 1px solid var(--line); border-left: 3px solid var(--violet);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; line-height: 1.5;
  }
  .score-explain b { color: var(--text); }

  /* Checks */
  .checks { display: block; width: 100%; }
  .check {
    display: block; width: 100%; margin-bottom: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden;
  }
  .check:last-child { margin-bottom: 0; }
  .check-inner { display: flex; gap: 13px; padding: 15px 17px; }
  .info-panel { clear: both; }
  .dot { flex-shrink: 0; width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; }
  .dot.OK      { background: var(--mint); box-shadow: 0 0 10px rgba(52,226,176,.6); }
  .dot.WARN    { background: var(--amber2); box-shadow: 0 0 10px rgba(255,182,56,.5); }
  .dot.DANGER  { background: var(--coral); box-shadow: 0 0 10px rgba(255,93,108,.5); }
  .dot.UNKNOWN { background: var(--muted); }
  .check .body { flex: 1; }
  .check-head { display: flex; align-items: center; gap: 8px; }
  .check .body h4 { font-size: 15px; margin-bottom: 3px; color: var(--text); font-weight: 600; }
  .check .body p { font-size: 13.5px; color: var(--text-soft); }

  /* Info-knop met puls */
  .info-btn {
    flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%;
    border: 1.5px solid var(--violet); background: transparent; color: var(--violet);
    font-family: Georgia, serif; font-style: italic; font-weight: bold; font-size: 13px;
    line-height: 1; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .info-btn:hover { background: var(--violet); color: #fff; }
  .info-btn.pulse { animation: infopulse 1.1s ease-out 3; }
  @keyframes infopulse {
    0%   { box-shadow: 0 0 0 0 rgba(139,107,255,.6); }
    70%  { box-shadow: 0 0 0 8px rgba(139,107,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(139,107,255,0); }
  }
  @media (prefers-reduced-motion: reduce) { .info-btn.pulse { animation: none; } .verdict .score.count { animation: none; } .meter > span { transition: none; } }

  /* Info-paneel */
  .info-panel {
    display: none; margin-top: 11px; padding: 13px 15px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    font-size: 13px; line-height: 1.55;
  }
  .info-panel.open { display: block; animation: slidein .2s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px);} to {opacity:1; transform:none;} }
  .info-panel p { margin-bottom: 8px; color: var(--text-soft); }
  .info-panel p:last-child { margin-bottom: 0; }
  .info-panel .tag-see   { font-weight: 700; color: var(--mint); }
  .info-panel .tag-blind { font-weight: 700; color: var(--coral); }
  .info-panel .tag-diy   { font-weight: 700; color: var(--violet); }

  /* Waarom-uitklap */
  details.why {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 4px 18px; margin: 16px 0;
  }
  details.why summary { cursor: pointer; padding: 13px 0; font-size: 15px; font-weight: 600; color: var(--text); list-style: none; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: "＋ "; color: var(--mint); font-weight: bold; }
  details.why[open] summary::before { content: "－ "; }
  details.why .why-body { padding: 2px 0 14px; }
  details.why .why-body p { font-size: 14px; color: var(--text-soft); line-height: 1.6; margin-bottom: 10px; }

  .full-disclaimer {
    font-size: 12.5px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin: 16px 0 44px; line-height: 1.55;
  }
  .full-disclaimer b { color: var(--coral); }

  .loading { text-align: center; color: var(--text-soft); padding: 30px; font-size: 15px; }
  .err { background: rgba(255,93,108,.12); border: 1px solid var(--coral-dim); color: #ffb3ba; border-radius: 14px; padding: 15px 17px; font-size: 14px; margin-bottom: 20px; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 22px 0 50px; border-top: 1px solid var(--line); }

  /* Begrippenlijst-overlay */
  .glossary-overlay { display: none; position: fixed; inset: 0; background: rgba(8,6,18,.7); backdrop-filter: blur(3px); z-index: 50; padding: 20px; overflow-y: auto; }
  .glossary-overlay.open { display: block; }
  .glossary-card {
    max-width: 620px; margin: 24px auto; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); padding: 24px 24px 32px;
  }
  .glossary-card h2 { font-size: 24px; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
  .glossary-close { border: none; background: transparent; font-size: 28px; cursor: pointer; color: var(--muted); line-height: 1; padding: 0 4px; }
  .glossary-close:hover { color: var(--text); }
  .glossary-intro { font-size: 13.5px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .term { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .term h3 { font-size: 15.5px; color: var(--mint); margin-bottom: 5px; font-weight: 600; }
  .term p { font-size: 13.5px; color: var(--text-soft); line-height: 1.55; }

  /* Share-knop + menu */
  .share-wrap { margin: 16px 0; text-align: center; position: relative; }
  .share-btn {
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    padding: 14px 26px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--violet), #6b8bff); color: #fff;
    box-shadow: 0 6px 22px rgba(139,107,255,.4); transition: transform .1s ease, box-shadow .2s ease;
    display: inline-flex; align-items: center; gap: 9px;
  }
  .share-btn:hover { transform: translateY(-1px); box-shadow: 0 9px 28px rgba(139,107,255,.5); }
  .share-menu {
    display: none; margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 8px; box-shadow: var(--shadow);
  }
  .share-menu.open { display: block; animation: slidein .2s ease; }
  .share-menu button {
    display: block; width: 100%; text-align: left; font-family: inherit; font-size: 14px;
    padding: 13px 15px; border: none; background: transparent; color: var(--text); cursor: pointer;
    border-radius: 10px; font-weight: 500;
  }
  .share-menu button:hover { background: var(--surface-2); color: var(--mint); }
  .share-toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--mint); color: #0b1220; font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 12px; box-shadow: 0 8px 30px rgba(52,226,176,.5);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 60;
  }
  .share-toast.show { opacity: 1; }

  /* Feedback-blok */
  .feedback {
    text-align: center; font-size: 13.5px; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 24px; line-height: 1.5;
  }
  .feedback a {
    display: inline-block; margin-top: 8px; color: var(--mint); font-weight: 700;
    text-decoration: none; border: 1px solid var(--mint-dim); border-radius: 10px;
    padding: 8px 16px; transition: background .15s ease, color .15s ease;
  }
  .feedback a:hover { background: var(--mint); color: #0b1220; }

  /* Modus-tabs: munt checken / wallet checken */
  .modetabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .modetabs button {
    flex: 1; padding: 12px 10px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface); color: var(--muted);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .modetabs button:hover { color: var(--text-soft); border-color: var(--violet); }
  .modetabs button.active {
    background: linear-gradient(135deg, var(--violet), #6f4ff0);
    color: #fff; border-color: transparent;
  }
  .wallet-intro {
    font-size: 14px; color: var(--text-soft); margin-bottom: 16px; line-height: 1.55;
  }
  .wallet-intro b { color: var(--text); font-weight: 700; }
  #wallet {
    flex: 1; font-size: 15px; font-family: inherit;
    padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--bg-2); color: var(--text); min-width: 0;
  }
  #wallet::placeholder { color: var(--muted); }
  #wallet:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,107,255,.25); }

  /* Portfolio-overzicht */
  .pf-summary {
    font-size: 15px; color: var(--text-soft); font-weight: 600;
    margin-bottom: 14px; text-align: center;
  }
  .pf-hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 16px; }
  .pf-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .pf-item:hover { border-color: var(--violet); transform: translateY(-1px); }
  .pf-badge {
    flex-shrink: 0; width: 54px; height: 54px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; line-height: 1;
  }
  .pf-badge small { font-size: 9px; font-weight: 600; opacity: .8; margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
  .pf-badge.low  { background: rgba(52,226,176,.16);  color: #34e2b0; }
  .pf-badge.mid  { background: rgba(255,182,56,.16);  color: #ffb638; }
  .pf-badge.high { background: rgba(255,93,108,.16);  color: #ff5d6c; }
  .pf-body { flex: 1; min-width: 0; }
  .pf-name { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-verdict { font-size: 13px; color: var(--text-soft); margin-top: 3px; }
  .pf-arrow { flex-shrink: 0; color: var(--muted); font-size: 20px; }

  @media (max-width: 560px) {
    .scan-row { flex-direction: column; }
    .logo { font-size: 28px; }
    .logo-mark { width: 40px; height: 40px; }
    .verdict .score { font-size: 56px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <button class="helpbtn" id="t-helpbtn" onclick="openGlossary()"></button>
    <div class="langswitch">
      <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      <button id="lang-nl" onclick="setLang('nl')">NL</button>
    </div>
  </div>

  <header>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RugGuard">
        <defs>
          <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d3a24a"/>
            <stop offset="1" stop-color="#a9781f"/>
          </linearGradient>
        </defs>
        <path d="M256 92 L392 138 C392 138 392 250 392 296 C392 372 328 418 256 452 C184 418 120 372 120 296 C120 250 120 138 120 138 Z"
              fill="#22345a" stroke="url(#lg-gold)" stroke-width="12" stroke-linejoin="round"/>
        <g transform="translate(256 272)">
          <path d="M0 -92 L72 0 L0 92 L-72 0 Z" fill="none" stroke="url(#lg-gold)" stroke-width="10" stroke-linejoin="round"/>
          <path d="M0 -46 L36 0 L0 46 L-36 0 Z" fill="url(#lg-gold)"/>
          <path d="M-17 2 L-4 16 L20 -14" fill="none" stroke="#0f1830" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <span class="logo-word">RugGuard</span>
    </div>
    <div class="tag" id="t-tag"></div>
  </header>

  <div class="intro" id="t-intro"></div>

  <div class="modetabs">
    <button id="tab-coin" class="active" onclick="setMode('coin')"></button>
    <button id="tab-wallet" onclick="setMode('wallet')"></button>
  </div>

  <div class="scan" id="scan-coin">
    <label for="mint" id="t-label"></label>
    <div class="scan-row">
      <input id="mint" type="text" spellcheck="false"
             placeholder="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" />
      <button class="go" id="go" onclick="run()"></button>
    </div>
  </div>

  <div class="scan" id="scan-wallet" style="display:none">
    <div class="wallet-intro" id="t-wallet-intro"></div>
    <label for="wallet" id="t-wallet-label"></label>
    <div class="scan-row">
      <input id="wallet" type="text" spellcheck="false" />
      <button class="go" id="go-wallet" onclick="runWallet()"></button>
    </div>
  </div>

  <div class="disclaimer" id="t-strip"></div>

  <div id="result"></div>

  <div class="feedback" id="feedback-block">
    <span id="t-feedback-text"></span>
    <a id="t-feedback-link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <footer id="t-footer"></footer>

</div>

<!-- Begrippenlijst-overlay -->
<div class="glossary-overlay" id="glossary" onclick="if(event.target===this)closeGlossary()">
  <div class="glossary-card">
    <h2><span id="t-gloss-title"></span><button class="glossary-close" onclick="closeGlossary()" aria-label="close">×</button></h2>
    <div class="glossary-intro" id="t-gloss-intro"></div>
    <div id="glossary-terms"></div>
  </div>
</div>

<div class="share-toast" id="share-toast"></div>

<script>
// De app praat met ons eigen beveiligde tussenlaagje (/api/rpc), niet
// rechtstreeks met Helius. De geheime sleutel zit veilig op de server.
const RPC = "/api/rpc";
const DEX = "https://api.dexscreener.com/latest/dex/tokens/";

// ▼▼▼ JOUW GOOGLE FORMULIER ▼▼▼
// Plak hier de volledige link van je (oude) Google Formulier tussen de
// aanhalingstekens. Dit is de ENIGE plek die je hoeft aan te passen.
// Voorbeeld: "https://docs.google.com/forms/d/e/XXXXXXXX/viewform"
const FEEDBACK_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSej3eCTiUUoS_4bUsvl3P6CPlWthv1MewZxi7BdsPrn_FZsZw/viewform";
// ▲▲▲ JOUW GOOGLE FORMULIER ▲▲▲

const T = {

    whyBody: "Think of RugGuard like having a house checked before you buy it. A good inspector spots the obvious problems \u2014 a leaking roof, bad wiring \u2014 and that's really useful. But they can't promise nothing will ever go wrong, and can't see every hidden issue behind the walls.\n\nChecking a coin works the same way. We read what's visible on the blockchain and flag the known dangers. But we can't see the future, we don't know the creators' plans, and scammers keep inventing new tricks. A clean result lowers your risk \u2014 it doesn't remove it.\n\nSo the rule is simple: use this as one helper among several, look into things yourself, and only ever invest money you can afford to lose completely.",

    glossary: [
      ["Coin / token", "A unit of value on the blockchain. A \u201cmemecoin\u201d is a coin made mostly for fun or hype, often with no real use behind it."],
      ["Blockchain", "A public digital record that stores every transaction. Anyone can look; no one can secretly change the past. Solana is one such blockchain."],
      ["Wallet", "Your digital wallet holds your coins. It has an address others can see, and a secret key only you should have."],
      ["Coin address", "The unique address of a coin on the blockchain \u2014 like an ID card for that coin. You paste it into RugGuard to check it."],
      ["Rug pull", "A scam where the creators suddenly pull out all the money or dump their coins, leaving yours worthless. RugGuard is named after guarding against this."],
      ["Liquidity", "The pool of money available to buy and sell a coin. Lots means you can sell easily; very little means you might get stuck unable to sell."],
      ["Locked / burned liquidity", "\u201cLocked\u201d means the money pool is held for a time so creators can't just take it. \u201cBurned\u201d means it's gone from their control for good. Both protect buyers."],
      ["Making new coins (mint)", "The power to create new coins. If creators can still do it, they can make more and lower the value of yours. Safer coins have this switched off."],
      ["Locking coins (freeze)", "The power to lock wallets so people can't sell. If creators can do it, they can trap you with coins you can't get rid of."],
      ["Honeypot", "A trap coin: you can buy it, but a hidden trick stops you from ever selling. Money goes in and can't come out."],
      ["Supply", "The total number of coins that exist. If a few owners hold most of them, they can crash the price by selling all at once."],
      ["Blockchain explorer", "A free website that shows everything about a coin on the blockchain: who owns it, its settings, its history. You use it to check things yourself."],

// Delen: kiest tussen het resultaat of de app zelf
function doShare(what) {
  var t = T[lang];
  var text;
  if (what === "result" && lastResult) {
    var name = lastResult.name || t.unknownToken;
    text = t.shareResultText(name, lastResult.score);
  } else {
    text = t.shareAppText;
  }
  var menu = document.getElementById("share-menu");
  if (menu) menu.classList.remove("open");

  // Gebruik de native deel-functie van de telefoon als die er is; anders kopieer naar klembord
  if (navigator.share) {
    navigator.share({ text: text }).catch(function(){ /* gebruiker annuleerde; niets doen */ });
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast(t.shareCopied); })
      .catch(function(){ fallbackCopy(text, t.shareCopied); });
  } else {
    fallbackCopy(text, t.shareCopied);
  }
}

function fallbackCopy(text, msg) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    showToast(msg);
  } catch (e) { /* stilletjes negeren */ }
}

function showToast(msg) {
  var el = document.getElementById("share-toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

// Kleine helper: een fetch die na een aantal seconden vanzelf afbreekt,
// zodat een vastgelopen server de app niet eindeloos laat hangen.
function fetchWithTimeout(url, opts, ms) {
  opts = opts || {};
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
  return fetch(url, Object.assign({}, opts, { signal: ctrl.signal }))
    .finally(function(){ clearTimeout(timer); });
}

async function rpc(method, params) {
  const res = await fetchWithTimeout(RPC, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: method, params: params }),
  }, 12000);
  if (!res.ok) throw new Error(T[lang].rpcErr);
  const json = await res.json();
  // JSON-RPC fouten komen terug in json.error, niet als HTTP-fout.
  if (json && json.error) throw new Error(T[lang].rpcErr);
  return json.result;
}
async function getDex(mint) {
  try {
    const res = await fetchWithTimeout(DEX + mint, {}, 12000);
    if (!res.ok) return null;
    const json = await res.json();
    if (!json.pairs || !json.pairs.length) return null;
    const sol = json.pairs.filter(function(p){ return p.chainId === "solana"; });
    const list = sol.length ? sol : json.pairs;
    return list.reduce(function(a, b){ return ((a.liquidity && a.liquidity.usd || 0) >= (b.liquidity && b.liquidity.usd || 0) ? a : b); });
  } catch (e) { return null; }
}
function fmt(n) { return Math.round(n).toLocaleString(lang === "nl" ? "nl-NL" : "en-US"); }

function buildChecks(info, pair, holders, supply) {
  const checks = [];

  if (!info) checks.push({ key: "freezeUnknown", level: "UNKNOWN", weight: 0 });
  else if (info.freezeAuthority) checks.push({ key: "freezeDanger", level: "DANGER", weight: 25 });
  else checks.push({ key: "freezeOk", level: "OK", weight: 0 });

  if (!info) checks.push({ key: "mintUnknown", level: "UNKNOWN", weight: 0 });
  else if (info.mintAuthority) checks.push({ key: "mintDanger", level: "DANGER", weight: 30 });
  else checks.push({ key: "mintOk", level: "OK", weight: 0 });

  const liq = pair && pair.liquidity ? pair.liquidity.usd : null;
  if (liq == null) checks.push({ key: "liqUnknown", level: "UNKNOWN", weight: 0 });
  else if (liq < 10000) checks.push({ key: "liqDanger", level: "DANGER", weight: 20, arg: liq });
  else if (liq < 50000) checks.push({ key: "liqWarn", level: "WARN", weight: 10, arg: liq });
  else checks.push({ key: "liqOk", level: "OK", weight: 0, arg: liq });

  // Aandeel van de 10 grootste eigenaren. We rekenen met de RUWE getallen
  // (h.amount) en delen door de ruwe totale voorraad. Het veld uiAmount kan
  // door de RPC-server als null worden teruggegeven; dan zou de oude code
  // stiekem 0% berekenen en een gevaarlijke munt "goed verspreid" noemen.
  const topRaw = holders ? holders.slice(0, 10).reduce(function(s, h){
    var a = h && h.amount != null ? Number(h.amount) : (h && h.uiAmount != null ? Number(h.uiAmount) : NaN);
    return s + (isNaN(a) ? 0 : a);
  }, 0) : 0;
  const haveHolders = holders && holders.length && topRaw > 0;
  const haveSupply = supply != null && Number(supply) > 0;
  if (!haveHolders || !haveSupply) checks.push({ key: "holdUnknown", level: "UNKNOWN", weight: 0 });
  else {
    const pct = topRaw / Number(supply) * 100;
    if (pct > 70) checks.push({ key: "holdDanger", level: "DANGER", weight: 25, arg: pct });
    else if (pct > 40) checks.push({ key: "holdWarn", level: "WARN", weight: 12, arg: pct });
    else checks.push({ key: "holdOk", level: "OK", weight: 0, arg: pct });
  }

  const t = pair ? pair.pairCreatedAt : null;
  if (!t) checks.push({ key: "ageUnknown", level: "UNKNOWN", weight: 0 });
  else {
    const h = (Date.now() - t) / 3.6e6;
    if (h < 1) checks.push({ key: "ageDanger", level: "DANGER", weight: 15, arg: h });
    else if (h < 24) checks.push({ key: "ageWarn", level: "WARN", weight: 8, arg: h });
    else checks.push({ key: "ageOk", level: "OK", weight: 0, arg: h / 24 });
  }

  const v = pair && pair.volume ? pair.volume.h24 : null;
  if (v == null) checks.push({ key: "volUnknown", level: "UNKNOWN", weight: 0 });
  else if (v < 5000) checks.push({ key: "volWarn", level: "WARN", weight: 5, arg: v });
  else checks.push({ key: "volOk", level: "OK", weight: 0, arg: v });

  return checks;
}

function localizeCheck(c) {
  const entry = T[lang].checks[c.key];
  if (typeof entry === "function") {
    let a = c.arg;
    if (c.key.indexOf("liq") === 0 || c.key.indexOf("vol") === 0) a = fmt(a);
    else if (c.key.indexOf("age") === 0) a = a.toFixed(1);
    else if (c.key.indexOf("hold") === 0) a = a.toFixed(0);
    return entry(a);
  }
  return entry;
}

async function analyze(mint) {
  const pair = await getDex(mint);
  let info = null, supply = null, holders = null;
  try { const acc = await rpc("getAccountInfo", [mint, { encoding: "jsonParsed" }]); info = acc && acc.value && acc.value.data && acc.value.data.parsed ? acc.value.data.parsed.info : null; } catch (e) {}
  try { const s = await rpc("getTokenSupply", [mint]); supply = s && s.value ? (s.value.amount != null ? s.value.amount : s.value.uiAmount) : null; } catch (e) {}
  try { const h = await rpc("getTokenLargestAccounts", [mint]); holders = h ? h.value : null; } catch (e) {}

  const checks = buildChecks(info, pair, holders, supply);
  let score = Math.min(100, checks.filter(function(c){ return c.level === "DANGER" || c.level === "WARN"; }).reduce(function(s, c){ return s + c.weight; }, 0));
  const dangers = checks.filter(function(c){ return c.level === "DANGER"; }).length;

  let band;
  if (score >= 60 || dangers >= 2) band = "high";
  else if (score >= 30 || dangers >= 1) band = "mid";
  else band = "low";

  return {
    checks: checks, score: score, band: band, dangers: dangers,
    name: pair && pair.baseToken ? pair.baseToken.name : null,
    symbol: pair && pair.baseToken ? pair.baseToken.symbol : "?",
  };
}

function render(r) {
  const t = T[lang];
  const out = document.getElementById("result");
  const name = r.name || t.unknownToken;

  // categorie uit de check-key halen (mint/freeze/liq/hold/age/vol) voor de uitleg
  function plainFor(key) {
    var cat = key.replace(/Danger|Warn|Ok|Unknown$/,"");
    return t.plain[cat] || null;
  }

  const rows = r.checks.map(function(c, i){
    const loc = localizeCheck(c);
    const info = plainFor(c.key);
    var infoBtn = "", infoPanel = "";
    if (info) {
      const lb = t.plainLabels;
      infoBtn = '<button class="info-btn pulse" aria-label="info" onclick="toggleInfo(' + i + ')">i</button>';
      infoPanel =
        '<div class="info-panel" id="info-' + i + '">' +
          '<p><span class="tag-see">' + escapeHtml(lb.see) + ':</span> ' + escapeHtml(info.see) + '</p>' +
          '<p><span class="tag-blind">' + escapeHtml(lb.blind) + ':</span> ' + escapeHtml(info.blind) + '</p>' +
          '<p><span class="tag-diy">' + escapeHtml(lb.diy) + ':</span> ' + escapeHtml(info.diy) + '</p>' +
        '</div>';
    }
    return '<div class="check">' +
        '<div class="check-inner">' +
          '<div class="dot ' + c.level + '"></div>' +
          '<div class="body">' +
            '<div class="check-head"><h4>' + escapeHtml(loc[0]) + '</h4>' + infoBtn + '</div>' +
            '<p>' + escapeHtml(loc[1]) + '</p>' +
            infoPanel +
          '</div>' +
        '</div>' +
      '</div>';
  }).join("");

  out.className = "show";
  out.innerHTML =
    '<div class="verdict ' + r.band + '">' +
      '<div class="token-name">' + escapeHtml(name) + ' (' + escapeHtml(r.symbol) + ')</div>' +
      '<div class="score-line"><span>' + t.scoreLabel + '</span><span>' + t.scoreHint + '</span></div>' +
      '<div class="score count">' + r.score + '<span style="font-size:22px;opacity:.7">/100</span></div>' +
      '<div class="meter"><span style="width:0%"></span></div>' +
      '<div class="headline">' + t.verdict[r.band] + '</div>' +
    '</div>' +
    '<div class="score-explain">' + t.scoreExplain + '</div>' +
    '<div class="checks">' + rows + '</div>' +
    '<div class="share-wrap">' +
      '<button class="share-btn" onclick="toggleShare()">\u2197 ' + escapeHtml(t.shareBtn) + '</button>' +
      '<div class="share-menu" id="share-menu">' +
        '<button onclick="doShare(\'result\')">' + escapeHtml(t.shareResultLabel) + '</button>' +
        '<button onclick="doShare(\'app\')">' + escapeHtml(t.shareAppLabel) + '</button>' +
      '</div>' +
    '</div>' +
    '<details class="why"><summary>' + escapeHtml(t.whyTitle) + '</summary>' +
      '<div class="why-body">' + t.whyBody.split("\n\n").map(function(par){ return '<p>' + escapeHtml(par) + '</p>'; }).join("") + '</div>' +
    '</details>' +
    '<div class="full-disclaimer">' + t.disclaimer + '</div>';

  // meterbalk vullen tot de risicoscore (klein uitstel zodat de overgang zichtbaar is)
  var bar = out.querySelector(".meter > span");
  if (bar) { setTimeout(function(){ bar.style.width = r.score + "%"; }, 60); }

  // stop de puls zodra de gebruiker gescrold/geklikt heeft, zodat het niet blijft trekken
  // (de puls-animatie speelt sowieso maar kort; dit is een extra rust-maatregel)
}

function run() {
  const mint = document.getElementById("mint").value.trim();
  const out = document.getElementById("result");
  const btn = document.getElementById("go");
  const t = T[lang];

  if (mint.length < 32 || mint.length > 44 || /[^1-9A-HJ-NP-Za-km-z]/.test(mint)) {
    lastResult = null;
    out.className = "show";
    out.innerHTML = '<div class="err">' + t.badAddr + '</div>';
    return;
  }

  btn.disabled = true; btn.textContent = t.scanning;
  out.className = "show";
  out.innerHTML = '<div class="loading">' + t.loading + '</div>';

  analyze(mint).then(function(r){
    lastResult = r;
    render(r);
    btn.disabled = false; btn.textContent = t.button;
  }).catch(function(err){
    lastResult = null;
    out.innerHTML = '<div class="err">' + t.somethingWrong + escapeHtml(err.message) + '<br>' + t.rpcErr + '</div>';
    btn.disabled = false; btn.textContent = t.button;
  });
}

// ===== Portfolio: alle munten in een wallet checken =====
const SPL_TOKEN_PROGRAM = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA";
const SPL_TOKEN_2022     = "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb";

// Haal de tokens op die in een wallet zitten. Geeft een lijst terug van
// { mint, amount } voor elke munt met een positief saldo.
async function getWalletTokens(owner) {
  let accounts = [];
  // Zowel het klassieke token-programma als Token-2022 uitlezen.
  for (const prog of [SPL_TOKEN_PROGRAM, SPL_TOKEN_2022]) {
    try {
      const res = await rpc("getTokenAccountsByOwner", [
        owner, { programId: prog }, { encoding: "jsonParsed" }
      ]);
      if (res && res.value) accounts = accounts.concat(res.value);
    } catch (e) { /* het ene programma kan falen; het andere kan nog lukken */ }
  }
  const byMint = {};
  for (const acc of accounts) {
    try {
      const info = acc.account.data.parsed.info;
      const amt = info.tokenAmount;
      const ui = amt && amt.uiAmount != null ? Number(amt.uiAmount)
               : (amt && amt.amount != null ? Number(amt.amount) : 0);
      if (ui > 0 && info.mint) {
        // Zelfde munt kan in meerdere token-accounts zitten: saldo's optellen,
        // zodat een munt nooit dubbel gecheckt of dubbel getoond wordt.
        byMint[info.mint] = (byMint[info.mint] || 0) + ui;
      }
    } catch (e) {}
  }
  return Object.keys(byMint).map(function(mint){ return { mint: mint, amount: byMint[mint] }; });
}

const WALLET_MAX_CHECKS = 12; // hoeveel munten we maximaal volledig checken

function runWallet() {
  const owner = document.getElementById("wallet").value.trim();
  const out = document.getElementById("result");
  const btn = document.getElementById("go-wallet");
  const t = T[lang];

  if (owner.length < 32 || owner.length > 44 || /[^1-9A-HJ-NP-Za-km-z]/.test(owner)) {
    lastResult = null;
    out.className = "show";
    out.innerHTML = '<div class="err">' + t.walletBadAddr + '</div>';
    return;
  }

  btn.disabled = true; btn.textContent = t.scanning;
  out.className = "show";
  out.innerHTML = '<div class="loading">' + t.walletLoading + '</div>';

  getWalletTokens(owner).then(async function(tokens){
    if (!tokens.length) {
      out.innerHTML = '<div class="loading">' + t.walletEmpty + '</div>';
      btn.disabled = false; btn.textContent = t.walletButton;
      return;
    }
    // Grootste posities eerst; daarna beperken tot een behapbaar aantal.
    tokens.sort(function(a, b){ return b.amount - a.amount; });
    const totalFound = tokens.length;
    const toCheck = tokens.slice(0, WALLET_MAX_CHECKS);

    const results = [];
    for (let i = 0; i < toCheck.length; i++) {
      out.innerHTML = '<div class="loading">' + t.walletCheckingN(i, toCheck.length) + '</div>';
      try {
        const r = await analyze(toCheck[i].mint);
        // munten zonder markt/naam overslaan: die zeggen een beginner niets
        if (r.name || (r.checks && r.checks.some(function(c){ return c.level === "DANGER" || c.level === "WARN"; }))) {
          r.mint = toCheck[i].mint;
          results.push(r);
        }
      } catch (e) { /* een enkele munt die faalt slaan we gewoon over */ }
    }

    renderWallet(results, totalFound, toCheck.length);
    btn.disabled = false; btn.textContent = t.walletButton;
  }).catch(function(err){
    out.innerHTML = '<div class="err">' + t.somethingWrong + escapeHtml(err.message) + '<br>' + t.rpcErr + '</div>';
    btn.disabled = false; btn.textContent = t.walletButton;
  });
}

function renderWallet(results, totalFound, checkedCount) {
  const t = T[lang];
  const out = document.getElementById("result");

  if (!results.length) {
    out.innerHTML = '<div class="loading">' + t.walletEmpty + '</div>';
    return;
  }

  // Meest risicovol eerst.
  results.sort(function(a, b){ return b.score - a.score; });

  const summary = totalFound > checkedCount
    ? t.walletTooMany(checkedCount, totalFound)
    : t.walletSummary(results.length);

  const items = results.map(function(r){
    const name = (r.name || t.unknownToken) + (r.symbol && r.symbol !== "?" ? " (" + r.symbol + ")" : "");
    return '<div class="pf-item" onclick="checkFromWallet(\'' + r.mint + '\')">' +
        '<div class="pf-badge ' + r.band + '">' + r.score + '<small>' + escapeHtml(t.walletScore) + '</small></div>' +
        '<div class="pf-body">' +
          '<div class="pf-name">' + escapeHtml(name) + '</div>' +
          '<div class="pf-verdict">' + escapeHtml(t.verdict[r.band]) + '</div>' +
        '</div>' +
        '<div class="pf-arrow">\u203a</div>' +
      '</div>';
  }).join("");

  out.className = "show";
  out.innerHTML =
    '<div class="pf-summary">' + escapeHtml(summary) + '</div>' +
    items +
    '<div class="pf-hint">' + escapeHtml(t.walletSafeHint) + '</div>' +
    '<div class="full-disclaimer">' + t.disclaimer + '</div>';
}

// Vanuit het portfolio doorklikken naar de volledige check van één munt.
function checkFromWallet(mint) {
  setMode("coin");
  document.getElementById("mint").value = mint;
  run();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(m){ return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[m]; });
}

document.getElementById("mint").addEventListener("keydown", function(e){ if (e.key === "Enter") run(); });
document.getElementById("wallet").addEventListener("keydown", function(e){ if (e.key === "Enter") runWallet(); });
